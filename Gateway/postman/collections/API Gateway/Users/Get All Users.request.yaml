$kind: http-request
method: POST
url: "{{gatewayBaseUrl}}/users"
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"name\":\"raj\",\r

    \    \"email\":\"rag123@abhdb.com\"\r

    }"
examples: .resources/Get All Users.resources/examples
order: 1000
description: |-
  Retrieves all users via the API Gateway.

  The Gateway proxies this request to the downstream Users service at
  http://localhost:5001/users and returns the response.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Response time is acceptable", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
